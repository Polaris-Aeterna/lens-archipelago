<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="你是一束白光。穿过十一面透镜，被语言、逻辑、价值与物理一次次折射，最后重新汇合。一个关于知识的互动旅程。">
<meta name="theme-color" content="#05080F">
<meta property="og:type" content="website">
<meta property="og:title" content="透镜群岛">
<meta property="og:description" content="你是一束白光。穿过十一面透镜，被语言、逻辑、价值与物理一次次折射，最后重新汇合。一个关于知识的互动旅程。">
<meta property="og:url" content="https://polaris-aeterna.github.io/lens-archipelago/">
<meta property="og:image" content="https://polaris-aeterna.github.io/lens-archipelago/media/screens/title.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%2305080F'/%3E%3Cpath d='M20 7 L33 30 L7 30 Z' fill='none' stroke='%23FFF6E4' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M21 22 L38 16 M21 22 L38 22 M21 22 L38 28' stroke='%23ff6b6b' stroke-width='1.5'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>透镜群岛</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;900&family=ZCOOL+XiaoWei&display=swap">
<style>
/* ZCOOL XiaoWei ships a broken glyph for 回 (renders as a solid block); route that one character to a serif. */
@font-face{font-family:"LensFix";src:local("Songti SC"),local("STSong"),local("SimSun"),local("Noto Serif CJK SC"),local("Source Han Serif SC"),
  url(https://fonts.gstatic.com/l/font?kit=H4cyBXePl9DZ0Xe7gG9cyOj7uK2-n-D2rd4FY7SCqyWq847hdT2Cc0UvG8U&skey=37fe335b8fd815cc&v=v36) format("woff2");
  unicode-range:U+56DE;font-display:swap}
/* Layout: an optical bench at night. One full-viewport stage; the HUD floats on top, the guide's voice docks at the bottom,
   and every screen is lit only by the beam and the eleven spectral hues. Deliberately single-theme (dark). */
:root{
  --void:#05080F; --deep:#0A1020; --panel:rgba(14,21,38,.88); --panel-solid:#101A2F; --raise:rgba(255,255,255,.04);
  --line:rgba(168,188,228,.15); --line-strong:rgba(190,206,240,.32);
  --text:#E8ECF5; --dim:#A2ADC4; --faint:#65708A; --beam:#FFF6E4;
  --ok:hsl(152 58% 58%); --bad:hsl(356 78% 66%);
  --c-lang:hsl(40 88% 62%); --c-value:hsl(12 80% 64%); --c-logic:hsl(182 62% 56%); --c-phys:hsl(140 50% 58%);
  --f-display:"LensFix","ZCOOL XiaoWei","Noto Serif SC","Songti SC","STSong",serif;
  --f-serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --hud-h:56px; --narr-h:0px; --hue:42;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--text);font-family:var(--f-sans);font-size:15px;line-height:1.6;
  overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--beam);outline-offset:2px;border-radius:6px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}
#stage{position:fixed;inset:0;z-index:1;overflow:hidden}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;height:var(--hud-h);padding-top:env(safe-area-inset-top,0px);
  display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,rgba(5,8,15,.92),rgba(5,8,15,.55) 70%,rgba(5,8,15,0));}
#hud[hidden]{display:none!important}
.hud-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.hud-mid{display:flex;align-items:center;justify-content:center;flex:0 1 auto}
.hud-right{display:flex;align-items:center;gap:6px;justify-content:flex-end;flex:1 1 auto}
.brand{font-family:var(--f-display);font-size:22px;letter-spacing:.06em;background:none;border:0;padding:6px 4px;cursor:pointer;white-space:nowrap}
.hud-title{font-family:var(--f-display);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hud-title small{font-family:var(--f-mono);font-size:11px;color:var(--dim);letter-spacing:.12em;margin-right:8px}
.hbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);cursor:pointer;font-size:13px;color:var(--dim);white-space:nowrap;transition:border-color .2s,color .2s,background .2s}
.hbtn:hover{border-color:var(--line-strong);color:var(--text);background:rgba(255,255,255,.06)}
.hbtn .n{font-family:var(--f-mono);font-size:12px;color:var(--text)}
.hbtn svg{width:16px;height:16px}
.meter{display:flex;gap:3px;align-items:center}
.meter i{display:block;width:14px;height:4px;border-radius:2px;background:rgba(255,255,255,.08);transition:background .6s,box-shadow .6s}
.meter i.on{background:hsl(var(--h) 85% 62%);box-shadow:0 0 8px hsl(var(--h) 85% 62% / .7)}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.12);transition:background .4s}
.dots i.on{background:hsl(var(--hue) 85% 64%);box-shadow:0 0 6px hsl(var(--hue) 85% 64% / .8)}
@media (max-width:640px){
  .meter i{width:8px} .brand{font-size:19px} .hbtn .lbl{display:none} .hbtn{padding:0 10px} .hud-title{font-size:16px}
}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
.level-root{position:absolute;left:0;right:0;top:calc(var(--hud-h) + env(safe-area-inset-top,0px));bottom:0;overflow:auto;
  padding-bottom:calc(var(--narr-h) + 24px);-webkit-overflow-scrolling:touch}

/* title */
.title-screen{display:grid;justify-items:center;align-items:start}
.title-screen canvas{position:absolute;inset:0;width:100%;height:100%}
.title-card{position:relative;z-index:2;text-align:center;display:grid;gap:18px;justify-items:center;padding-block:clamp(48px,11vh,120px) 40px;max-width:640px}
.title-kicker{font-family:var(--f-mono);font-size:12px;letter-spacing:.32em;color:var(--dim);text-transform:uppercase}
.title-name{font-family:var(--f-display);font-size:clamp(56px,13vw,124px);line-height:1;letter-spacing:.08em;margin:0;
  text-shadow:0 0 40px rgba(255,246,228,.25)}
.title-sub{font-family:var(--f-serif);font-size:clamp(15px,2.4vw,19px);color:var(--dim);margin:0;text-wrap:balance}
.title-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line-strong);background:rgba(255,255,255,.04);font-size:15px;letter-spacing:.04em;transition:transform .15s,background .2s,border-color .2s}
.btn:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.5)}
.btn:active{transform:scale(.98)}
.btn.primary{border:0;color:#0A0E18;font-weight:700;background:var(--beam);box-shadow:0 0 28px rgba(255,246,228,.35)}
.btn.primary:hover{background:#fff}
.btn.hue{border-color:hsl(var(--hue) 80% 62% / .7);background:hsl(var(--hue) 80% 62% / .14)}
.btn.hue:hover{background:hsl(var(--hue) 80% 62% / .26)}
.title-foot{font-size:12px;color:var(--faint);max-width:420px;text-wrap:balance}

/* map */
.map-screen{padding-top:calc(var(--hud-h) + env(safe-area-inset-top,0px))}
.map-wrap{position:relative;width:100%;min-height:100%}
.map-svg{display:block;width:100%;height:auto;max-height:calc(100vh - var(--hud-h) - 20px)}
.map-svg.portrait{max-height:none}
.isle{cursor:pointer}
.isle .lens{transition:fill .8s, stroke .4s}
.isle:hover .lens,.isle:focus-visible .lens{stroke-width:2.2}
.isle text{pointer-events:none}
.isle-name{font-family:var(--f-display);font-size:20px;fill:var(--text)}
.isle-no{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;fill:var(--dim)}
.cont-label{font-family:var(--f-display);font-size:30px;fill:rgba(232,236,245,.13);letter-spacing:.3em}
.bridge{fill:none;stroke-width:1.3;stroke:rgba(170,190,230,.18);stroke-dasharray:3 6}
.bridge.lit{stroke-dasharray:none;stroke-width:1.8;cursor:pointer;opacity:.85}
.bridge-hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.bridge-tag{font-family:var(--f-mono);font-size:11px;fill:#0A0E18;font-weight:500}
.next-ring{fill:none;stroke:var(--beam);stroke-width:1.2;opacity:.8;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.map-panel{position:fixed;z-index:4;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 32px));
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 20px 60px rgba(0,0,0,.5);display:grid;gap:10px}
.map-panel h3{margin:0;font-family:var(--f-display);font-size:28px;font-weight:400;line-height:1.1}
.map-panel .kick{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--dim)}
.map-panel p{margin:0;color:var(--dim);font-family:var(--f-serif);font-size:14px}
.map-panel .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.chip b{width:8px;height:8px;border-radius:50%;background:hsl(var(--h,42) 80% 62%)}
.xbtn{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;color:var(--dim)}
.map-hint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--faint);max-width:280px}
.reunite{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--hud-h) + 18px);z-index:3}

/* narrator */
#narr{position:fixed;z-index:6;left:0;right:0;bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none;
  display:flex;justify-content:center}
#narr .box{pointer-events:auto;width:min(760px,100%);display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px 14px 14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 18px 50px rgba(0,0,0,.55);transform:translateY(12px);opacity:0;transition:transform .35s ease,opacity .35s ease}
#narr.show .box{transform:none;opacity:1}
#narr:not(.show) .box{pointer-events:none;visibility:hidden;transition:transform .35s ease,opacity .35s ease,visibility 0s .35s}
#narr .glyph{width:40px;height:40px}
#narr .who{font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:var(--dim);margin-bottom:2px}
#narr .txt{font-family:var(--f-serif);font-size:16px;line-height:1.75;min-height:1.75em;text-wrap:pretty}
#narr .txt b{color:hsl(var(--hue) 85% 72%);font-weight:600}
#narr .go{grid-column:2;justify-self:end;margin-top:4px;background:none;border:1px solid var(--line);border-radius:999px;height:32px;padding:0 14px;cursor:pointer;color:var(--dim);font-size:13px}
#narr .go:hover{color:var(--text);border-color:var(--line-strong)}
#narr .go[hidden]{display:none!important}
@media (max-width:640px){#narr .txt{font-size:15px} #narr .glyph{width:32px;height:32px}}

/* overlay + modal */
#overlay{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:rgba(3,5,10,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding-block:calc(var(--hud-h) + 12px) 20px;overflow:auto}
#overlay[hidden]{display:none!important}
.modal{position:relative;width:min(620px,100%);background:var(--panel-solid);border:1px solid var(--line);border-radius:20px;padding:26px 24px 22px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);display:grid;gap:14px}
.modal h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.15;text-wrap:balance}
.modal .kick{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;color:hsl(var(--hue) 80% 70%)}
.modal p{margin:0;font-family:var(--f-serif);color:var(--dim)}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;font-size:15px;line-height:1.55;
  transition:border-color .2s,background .2s}
.opt:hover:not([disabled]){border-color:hsl(var(--hue) 80% 62% / .7);background:hsl(var(--hue) 80% 62% / .08)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:hsl(152 58% 58% / .12)}
.opt.wrong{border-color:var(--bad);background:hsl(356 78% 66% / .1)}
.why{font-family:var(--f-serif);font-size:15px;line-height:1.75;color:var(--text);border-left:2px solid hsl(var(--hue) 80% 62%);padding:4px 0 4px 14px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* toast */
#toasts{position:fixed;z-index:9;top:calc(var(--hud-h) + 10px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid hsl(var(--h) 80% 62% / .55);border-radius:12px;padding:10px 14px;
  box-shadow:0 0 24px hsl(var(--h) 80% 62% / .25);animation:tin .5s ease both}
.toast .card-ico{width:18px;height:26px;border-radius:4px;background:linear-gradient(160deg,hsl(var(--h) 85% 70%),hsl(var(--h) 70% 40%));box-shadow:0 0 10px hsl(var(--h) 85% 62% / .7)}
.toast .t1{font-size:11px;color:var(--dim);font-family:var(--f-mono);letter-spacing:.12em}
.toast .t2{font-family:var(--f-display);font-size:18px;line-height:1.1}
.toast.out{animation:tout .4s ease both}
@keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{transform:translateX(30px);opacity:0}}

/* codex */
.codex{padding-top:calc(var(--hud-h) + 18px + env(safe-area-inset-top,0px));padding-bottom:40px}
.codex-head{max-width:1100px;margin:0 auto 18px;display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.codex-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1}
.codex-head p{margin:6px 0 0;color:var(--dim);font-family:var(--f-serif)}
.codex-group{max-width:1100px;margin:0 auto 26px}
.codex-group h4{margin:0 0 10px;font-family:var(--f-display);font-weight:400;font-size:20px;display:flex;align-items:center;gap:10px}
.codex-group h4 small{font-family:var(--f-mono);font-size:11px;color:var(--dim);letter-spacing:.14em}
.codex-group h4 b{width:10px;height:10px;border-radius:50%;background:hsl(var(--h) 85% 62%);box-shadow:0 0 10px hsl(var(--h) 85% 62%)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.card{position:relative;text-align:left;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.025);padding:12px 12px 12px 16px;cursor:pointer;min-height:84px;
  display:grid;align-content:start;gap:4px;overflow:hidden;transition:border-color .2s,transform .2s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:hsl(var(--h) 85% 62%)}
.card:hover{border-color:hsl(var(--h) 80% 62% / .6);transform:translateY(-1px)}
.card .ct{font-family:var(--f-display);font-size:18px;line-height:1.2}
.card .ce{font-size:12px;color:var(--dim);font-style:italic}
.card.locked{cursor:default;opacity:.55}
.card.locked::before{background:rgba(255,255,255,.12)}
.card.locked:hover{transform:none;border-color:var(--line)}
.card-full .body{font-family:var(--f-serif);font-size:16px;line-height:1.85;color:var(--text)}
.card-full .ref{font-size:13px;color:var(--dim);border-top:1px solid var(--line);padding-top:10px}

/* complete */
.done-lens{width:120px;height:80px;margin:4px auto 0;display:block}
.center{text-align:center;justify-items:center}

/* error */
.lv-error{max-width:560px;margin:80px auto;color:var(--dim);font-family:var(--f-serif)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="stage"></div>
<header id="hud" class="gutter" hidden></header>
<div id="narr" class="gutter" aria-live="polite"></div>
<div id="overlay" class="gutter" hidden></div>
<div id="toasts"></div>

<script src="engine.js"></script>
<script src="levels/l01.js"></script>
<script src="levels/l02.js"></script>
<script src="levels/l03.js"></script>
<script src="levels/l04.js"></script>
<script src="levels/l05.js"></script>
<script src="levels/l06.js"></script>
<script src="levels/l07.js"></script>
<script src="levels/l08.js"></script>
<script src="levels/l09.js"></script>
<script src="levels/l10.js"></script>
<script src="levels/l11.js"></script>
<script src="finale.js"></script>
<script>Lens.boot();</script>

</body>
</html>
